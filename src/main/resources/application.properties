spring.application.name=trading-journal-backend
server.port=${PORT:8080}

# Database Configuration with Environment Variables support
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trading_journal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Date and Time
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Allowed CORS Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
